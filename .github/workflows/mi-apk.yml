name: Mi APK

# Se corre a mano: pestaña Actions -> "Mi APK" -> Run workflow.
# Compila LiteDash (con tu dial de volumen) firmado con TU llave y deja el APK para descargar.
on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.LITEDASH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto LITEDASH_KEYSTORE_BASE64 (ver SECRETOS_firma.txt)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mi-litedash.jks"
          echo "LITEDASH_STORE_FILE=$RUNNER_TEMP/mi-litedash.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          LITEDASH_STORE_PASSWORD: ${{ secrets.LITEDASH_STORE_PASSWORD }}
          LITEDASH_KEY_ALIAS: ${{ secrets.LITEDASH_KEY_ALIAS }}
          LITEDASH_KEY_PASSWORD: ${{ secrets.LITEDASH_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease --console=plain

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-litedash-apk
          path: app/build/outputs/apk/github/release/app-github-release.apk
